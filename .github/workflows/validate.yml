name: Validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Portable production-code regressions and release checks
        run: python tools/check.py

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: full
            flash: 4MB
          - example: full
            flash: 8MB
          - example: minimal
            flash: 4MB
          - example: rgb
            flash: 4MB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned ESPHome
        run: python -m pip install -r requirements.txt
      - name: Cache ESPHome toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-2026.9.1-idf-5.5.5-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Validate, compile and inspect final linked hooks
        run: python tools/check_config.py --example '${{ matrix.example }}' --flash '${{ matrix.flash }}' --compile
      # No firmware upload or artifact publication. Test secrets and all generated
      # firmware live only in a temporary directory deleted by check_config.py.
