# Home Assistant configuration; merge with an existing template list.
# First create media_player.office_partyboxes as a Media player group helper.
template:
  - switch:
      - name: Office PartyBoxes audio
        unique_id: office_partyboxes_audio
        availability: >-
          {{ expand(state_attr('media_player.office_partyboxes', 'entity_id') or [])
             | rejectattr('state', 'in', ['unavailable', 'unknown'])
             | selectattr('attributes.is_volume_muted', 'defined') | list | count > 0 }}
        state: >-
          {% set members = expand(state_attr('media_player.office_partyboxes', 'entity_id') or [])
             | rejectattr('state', 'in', ['unavailable', 'unknown'])
             | selectattr('attributes.is_volume_muted', 'defined') | list %}
          {{ members | selectattr('attributes.is_volume_muted', 'eq', false) | list | count > 0 }}
        turn_on:
          - action: media_player.volume_mute
            target:
              entity_id: media_player.office_partyboxes
            data:
              is_volume_muted: false
        turn_off:
          - action: media_player.volume_mute
            target:
              entity_id: media_player.office_partyboxes
            data:
              is_volume_muted: true
  - number:
      - name: Office PartyBoxes volume
        unique_id: office_partyboxes_volume
        min: 0
        max: 1
        step: 0.03125
        availability: >-
          {{ expand(state_attr('media_player.office_partyboxes', 'entity_id') or [])
             | rejectattr('state', 'in', ['unavailable', 'unknown'])
             | selectattr('attributes.volume_level', 'defined')
             | map(attribute='attributes.volume_level')
             | select('number') | list | count > 0 }}
        state: >-
          {% set levels = expand(state_attr('media_player.office_partyboxes', 'entity_id') or [])
             | rejectattr('state', 'in', ['unavailable', 'unknown'])
             | selectattr('attributes.volume_level', 'defined')
             | map(attribute='attributes.volume_level')
             | select('number') | list %}
          {{ levels | average if levels else none }}
        set_value:
          - action: media_player.volume_set
            target:
              entity_id: media_player.office_partyboxes
            data:
              volume_level: "{{ value }}"
  - select:
    - name: Office PartyBoxes bass boost
      options: '{{ ["Mixed","Off","Level 1","Level 2"] }}'
      state: |-
        {% set ns = namespace(ids=[]) %}
        {% for player in state_attr('media_player.office_partyboxes', 'entity_id') or [] %}
          {% set prefix = player | replace('media_player.', '') | regex_replace('_player$', '') %}
          {% set ns.ids = ns.ids + ['select.' ~ prefix ~ '_bass_boost'] %}
        {% endfor %}
        {% set values = ns.ids | map('states') | unique | list %}
        {{ values[0] if values | count == 1 and values[0] in ["Off","Level 1","Level 2"] else 'Mixed' }}
      select_option:
      - if:
        - condition: template
          value_template: '{{ option != ''Mixed'' }}'
        then:
        - action: select.select_option
          target:
            entity_id: |-
              {% set ns = namespace(ids=[]) %}
              {% for player in state_attr('media_player.office_partyboxes', 'entity_id') or [] %}
                {% set prefix = player | replace('media_player.', '') | regex_replace('_player$', '') %}
                {% set ns.ids = ns.ids + ['select.' ~ prefix ~ '_bass_boost'] %}
              {% endfor %}
              {{ ns.ids }}
          data:
            option: '{{ option }}'
      unique_id: office_partyboxes_bass_boost
      availability: |-
        {% set ns = namespace(ids=[]) %}
        {% for player in state_attr('media_player.office_partyboxes', 'entity_id') or [] %}
          {% set prefix = player | replace('media_player.', '') | regex_replace('_player$', '') %}
          {% set ns.ids = ns.ids + ['select.' ~ prefix ~ '_bass_boost'] %}
        {% endfor %}
        {{ expand(ns.ids) | rejectattr('state', 'in', ['unavailable', 'unknown']) | list | count > 0 }}
    - name: Office PartyBoxes lighting
      options: '{{ ["Mixed","Off","Pattern 1","Pattern 2","Pattern 3","Pattern 4"] }}'
      state: |-
        {% set ns = namespace(ids=[]) %}
        {% for player in state_attr('media_player.office_partyboxes', 'entity_id') or [] %}
          {% set prefix = player | replace('media_player.', '') | regex_replace('_player$', '') %}
          {% set ns.ids = ns.ids + ['select.' ~ prefix ~ '_lighting'] %}
        {% endfor %}
        {% set values = ns.ids | map('states') | unique | list %}
        {{ values[0] if values | count == 1 and values[0] in ["Off","Pattern 1","Pattern 2","Pattern 3","Pattern 4"] else 'Mixed' }}
      select_option:
      - if:
        - condition: template
          value_template: '{{ option != ''Mixed'' }}'
        then:
        - action: select.select_option
          target:
            entity_id: |-
              {% set ns = namespace(ids=[]) %}
              {% for player in state_attr('media_player.office_partyboxes', 'entity_id') or [] %}
                {% set prefix = player | replace('media_player.', '') | regex_replace('_player$', '') %}
                {% set ns.ids = ns.ids + ['select.' ~ prefix ~ '_lighting'] %}
              {% endfor %}
              {{ ns.ids }}
          data:
            option: '{{ option }}'
      unique_id: office_partyboxes_lighting
      availability: |-
        {% set ns = namespace(ids=[]) %}
        {% for player in state_attr('media_player.office_partyboxes', 'entity_id') or [] %}
          {% set prefix = player | replace('media_player.', '') | regex_replace('_player$', '') %}
          {% set ns.ids = ns.ids + ['select.' ~ prefix ~ '_lighting'] %}
        {% endfor %}
        {{ expand(ns.ids) | rejectattr('state', 'in', ['unavailable', 'unknown']) | list | count > 0 }}
