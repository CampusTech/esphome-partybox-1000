# Requires ESPHome 2026.9.1, original ESP32 and ESP-IDF 5.5.5 (not ESP32-S3/C3).
substitutions:
  name: partybox-1000
  friendly_name: PartyBox 1000

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1
  project:
    name: campustech.partybox_1000
    version: 0.1.0-beta.1

esp32:
  board: esp32dev
  flash_size: 4MB  # Set 8MB for boards fitted with 8MB flash.
  framework:
    type: esp-idf
    version: 5.5.5
    # Match the tested placement; roaming scans remain disabled below.
    sdkconfig_options:
      CONFIG_BTDM_CTRL_PINNED_TO_CORE_0: "y"
      CONFIG_BTDM_CTRL_PINNED_TO_CORE_1: "n"
      CONFIG_BT_BLUEDROID_PINNED_TO_CORE_0: "y"
      CONFIG_BT_BLUEDROID_PINNED_TO_CORE_1: "n"
      CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_0: "n"
      CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_1: "y"

external_components:
  - source:
      type: local
      path: ../components
    components: [partybox]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Stationary bridge: avoid periodic background roaming scans.
  post_connect_roaming: false
  power_save_mode: LIGHT
  ap:
    ssid: ${friendly_name} Setup
    password: !secret setup_password
  reboot_timeout: 0s

captive_portal:

partybox:
  id: jbl
  mac_address: !secret speaker_mac
  media_player:
    name: Player
  source:
    name: Source
  bass:
    name: Bass boost
  lighting:
    name: Lighting
  connect:
    name: Connect Bluetooth
  standby:
    name: Standby
  wake:
    name: Wake
  query_version:
    name: Query firmware version
  tws_connected:
    name: TWS connected
  spp_connected:
    name: SPP connected
  signal_activity:
    name: Selected input signal
  smart_dj:
    name: Smart DJ reported
  voice_cancel:
    name: Voice cancel reported
  volume_steps:
    name: Volume steps
    accuracy_decimals: 0
  volume_confidence:
    name: Volume confidence
  mute_confidence:
    name: Mute confidence
  source_confidence:
    name: Source confidence
  power_confidence:
    name: Power confidence
  bass_confidence:
    name: Bass confidence
  lighting_confidence:
    name: Lighting confidence
  activity_confidence:
    name: Activity confidence
  power_estimate:
    name: Power estimate
  last_command:
    name: Last command
  firmware_version:
    name: Firmware version
  last_word:
    name: Last TWS word
  free_heap:
    name: Free heap
    unit_of_measurement: B
    accuracy_decimals: 0
  minimum_heap:
    name: Minimum heap
    unit_of_measurement: B
    accuracy_decimals: 0
  largest_free_block:
    name: Largest free block
    unit_of_measurement: B
    accuracy_decimals: 0
  received_words:
    name: Received TWS words
    accuracy_decimals: 0
  dropped_events:
    name: Dropped events
    accuracy_decimals: 0
  received_audio_bytes:
    name: Received audio bytes
    accuracy_decimals: 0
  queued_commands:
    name: Queued commands
    accuracy_decimals: 0
  snapshot_age:
    name: Snapshot age
    unit_of_measurement: s
    accuracy_decimals: 0
