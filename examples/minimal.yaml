# Requires ESPHome 2026.9.1, original ESP32 and ESP-IDF 5.5.5 (not ESP32-S3/C3).
substitutions:
  name: partybox-1000
  friendly_name: PartyBox 1000

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1
  project:
    name: campustech.partybox_1000
    version: 0.1.0-beta.1

esp32:
  board: esp32dev
  flash_size: 4MB  # Set 8MB for boards fitted with 8MB flash.
  framework:
    type: esp-idf
    version: 5.5.5
    # Match the tested placement; roaming scans remain disabled below.
    sdkconfig_options:
      CONFIG_BTDM_CTRL_PINNED_TO_CORE_0: "y"
      CONFIG_BTDM_CTRL_PINNED_TO_CORE_1: "n"
      CONFIG_BT_BLUEDROID_PINNED_TO_CORE_0: "y"
      CONFIG_BT_BLUEDROID_PINNED_TO_CORE_1: "n"
      CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_0: "n"
      CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_1: "y"

external_components:
  - source:
      type: local
      path: ../components
    components: [partybox]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Stationary bridge: avoid periodic background roaming scans.
  post_connect_roaming: false
  power_save_mode: LIGHT
  ap:
    ssid: ${friendly_name} Setup
    password: !secret setup_password
  reboot_timeout: 0s

captive_portal:

# Player and link status only; omit other default entities.
partybox:
  id: jbl
  mac_address: !secret speaker_mac
  source: false
  bass: false
  lighting: false
  connect: false
  standby: false
  wake: false
  query_version: false
  signal_activity: false
  smart_dj: false
  voice_cancel: false
  volume_steps: false
  volume_confidence: false
  mute_confidence: false
  source_confidence: false
  power_confidence: false
  bass_confidence: false
  lighting_confidence: false
  activity_confidence: false
  power_estimate: false
  last_command: false
  firmware_version: false
  last_word: false
  free_heap: false
  minimum_heap: false
  largest_free_block: false
  received_words: false
  dropped_events: false
  received_audio_bytes: false
  queued_commands: false
  snapshot_age: false
